[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxiv-exact"
version = "2.5.1"
description = "MAX IV EXACT — Exploration of X-ray Absorption: Characterization and Treatment."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Alexei Preobrajenski" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyQt6>=6.11",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "scipy>=1.18.1",
  "h5py>=3.16.0",
  "markdown>=3.10.3",
  "pandas>=3.0.6",
  "scikit-learn>=1.9.1",
]

[project.scripts]
exact = "maxiv_exact.app:main"
maxiv-exact = "maxiv_exact.app:main"
# Compatibility launcher retained during the 2.5 transition.
flexpes-nexafs = "maxiv_exact.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["maxiv_exact*"]

[tool.setuptools.package-data]
maxiv_exact = ["docs/*.md", "docs/*.json", "library.h5", "example_data/*", "assets/*.ico", "assets/*.icns", "assets/*.png"]
